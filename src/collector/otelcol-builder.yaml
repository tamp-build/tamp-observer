# OpenTelemetry Collector Builder (ocb) manifest for the tamp-observer collector
# distribution (ADR 0003). We compose the real Collector, not a from-scratch receiver:
# OTLP in, a minimal processor, and (for now) placeholder exporters standing in for the
# thin "land raw bytes and ack" exporter that is ours to write next.
#
# ocb generates the distribution; Tamp.Go compiles it (rule #3 dogfood). All core modules
# move in lockstep at the collector release version.
dist:
  name: tamp-observer-collector
  description: tamp-observer custom OpenTelemetry Collector distribution (ADR 0003 spike)
  output_path: ./_dist
  version: 0.1.0-spike
  otelcol_version: 0.162.0

receivers:
  # The one front door that matters for the OTLP-pure boundary (ADR 0009).
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.162.0

processors:
  # Minimal processor only; the collector stays a dumb fast pipe (ADR 0003/0004).
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.162.0

exporters:
  # Raw-bucket landing exporters (ADR 0004 section 2): the write-side tier dial. The pipeline config
  # picks which one to use. rawfile = floor, valkeystream = high tier.
  - gomod: github.com/tamp-build/tamp-observer/collector/rawfileexporter v0.0.0
  - gomod: github.com/tamp-build/tamp-observer/collector/valkeystreamexporter v0.0.0
  # Kept for dev visibility alongside the raw landing.
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.162.0

# The raw-landing exporters are local modules in this repo (relative to output_path ./_dist).
replaces:
  - github.com/tamp-build/tamp-observer/collector/rawfileexporter => ../rawfileexporter
  - github.com/tamp-build/tamp-observer/collector/valkeystreamexporter => ../valkeystreamexporter
