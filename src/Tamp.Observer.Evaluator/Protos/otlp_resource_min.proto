syntax = "proto3";

// A MINIMAL schema that is wire-compatible with the OTLP top-level Data messages for the one
// thing the entity resolver needs: resource attributes. Field numbers match the real OTLP protos,
// and protobuf ignores unknown fields, so a single schema parses traces, logs, and metrics:
//
//   TracesData.resource_spans      = 1  -> SignalData.resource_entries = 1
//   LogsData.resource_logs         = 1  -> SignalData.resource_entries = 1
//   MetricsData.resource_metrics   = 1  -> SignalData.resource_entries = 1
//   ResourceSpans/Logs/Metrics.resource = 1 -> ResourceEntry.resource = 1 (scope_* / schema_url ignored)
//   Resource.attributes            = 1
//   KeyValue{ key = 1, value = 2 }
//   AnyValue.string_value          = 1
//
// This is a deliberate spike simplification. Deep OTLP reconstruction (spans, exception data per
// ADR 0009) will use the full OTLP protos; this reads only what entity resolution needs.
package tamp.observer.otlpmin;

option csharp_namespace = "Tamp.Observer.Evaluator.Otlp";

message SignalData {
  repeated ResourceEntry resource_entries = 1;
}

message ResourceEntry {
  Resource resource = 1;
}

message Resource {
  repeated KeyValue attributes = 1;
}

message KeyValue {
  string key = 1;
  AnyValue value = 2;
}

message AnyValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    bytes bytes_value = 7;
  }
}
