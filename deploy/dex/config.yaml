# Bundled development OIDC provider (Dex) for the single-box floor (ADR 0013). This makes `/api` reachable out
# of the box without standing up an external IdP, while keeping authN genuinely external: the API validates
# real OIDC tokens, same code path as production. For a hardened or air-gapped deploy, point
# OBSERVER_OIDC_AUTHORITY at the enclave IdP (AD/Keycloak/etc) and drop this service; nothing in the app
# depends on Dex specifically.
#
# The issuer host is id.localhost on purpose: browsers resolve *.localhost to loopback automatically, and the
# API container reaches the same name via host-gateway (see docker-compose.yml), so the token issuer string is
# identical from the browser and from the API. Dev only: in-memory storage, HTTP, one static user.
issuer: http://id.localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556
  # The SPA (served at :8080 in the single-host image, :5173 under Vite dev) does the PKCE code exchange and
  # discovery/jwks fetches from the browser, so Dex must allow those origins (CORS).
  allowedOrigins:
    - http://localhost:8080
    - http://localhost:8088
    - http://localhost:5173

oauth2:
  skipApprovalScreen: true
  passwordConnector: local

enablePasswordDB: true
staticPasswords:
  # dev@tamp.local / password  (bcrypt). Dev convenience only; never ship this.
  #
  # SonarCloud flags this hash as a committed credential (secrets:S8215, BLOCKER). It is
  # accepted rather than fixed, because there is nothing here to revoke: the password is the
  # literal string "password", it is published in this very comment, and it authenticates
  # against an in-memory Dex (`storage: type: memory`) served over plain HTTP on
  # id.localhost:5556 — a provider that exists only on a developer's own machine and holds no
  # state between restarts. Replacing the hash would change nothing about who can use it.
  #
  # What WOULD be worth doing, if this file ever stops being dev-only: inject the hash from the
  # environment instead of committing it. Note that Dex applies os.ExpandEnv to its config and a
  # bcrypt hash is full of `$`, so that change needs testing rather than assuming — which is why
  # it was not done as a drive-by here.
  #
  # If you are reading this because you are adapting the deployment for real use: delete this
  # whole staticPasswords block and point OBSERVER_OIDC_AUTHORITY at your own IdP. The API
  # validates real OIDC tokens on the same code path, so nothing else has to change.
  - email: "dev@tamp.local"
    hash: "$2y$10$JvXbjkRvTryTbLEEcCpMre6xtVle8WoInZfSnJ10SvvkrH.uBRnfa"
    username: "dev"
    userID: "dev-0001"

staticClients:
  # Public client for the Svelte SPA (authorization code + PKCE, no secret).
  - id: tamp-observer
    name: tamp-observer
    public: true
    redirectURIs:
      - http://localhost:8080/
      - http://localhost:8080/callback
      - http://localhost:8088/
      - http://localhost:8088/callback
      - http://localhost:5173/
      - http://localhost:5173/callback
