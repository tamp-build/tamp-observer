{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tamp-observer.fullname" . }}-secrets
  labels:
    {{- include "tamp-observer.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  # Full Npgsql connection string the evaluator and api read as OBSERVER_DB.
  observer-db: {{ printf "Host=%s;Port=5432;Database=%s;Username=%s;Password=%s" (include "tamp-observer.postgresHost" .) .Values.postgres.auth.database .Values.postgres.auth.username .Values.secrets.postgresPassword | quote }}
  dex-github-client-secret: {{ .Values.secrets.dexGithubClientSecret | quote }}
  {{- if .Values.clickhouse.enabled }}
  observer-clickhouse: {{ .Values.secrets.clickhouseConnectionString | quote }}
  {{- end }}
{{- end }}
