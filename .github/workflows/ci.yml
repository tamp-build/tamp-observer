name: CI

# Fast lane: build + unit tests on every push and PR. No containers, so no Docker needed.
# Integration tests (Testcontainers) and the SonarCloud scan run in nightly.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: build & unit tests
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      # Dogfood: the build exports its own ADR 0018 telemetry (Tamp.Build*) to the live tamp-observer over OTLP,
      # authenticated to the Cloudflare Access gate on otlp.brewingcoder.com with the CI service token.
      OTEL_EXPORTER_OTLP_ENDPOINT: 'https://otlp.brewingcoder.com'
      OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
      OTEL_EXPORTER_OTLP_HEADERS: 'CF-Access-Client-Id=${{ secrets.CF_ACCESS_CLIENT_ID }},CF-Access-Client-Secret=${{ secrets.CF_ACCESS_CLIENT_SECRET }}'
      OBSERVER_BUILD_ENV: 'ci'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Info + Clean + UnitTest (Category!=Integration). The dogfooded tamp build drives it.
      - name: Build + unit tests
        run: dotnet run --project build -- Ci

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Lint the deploy chart via the dogfooded tamp build (Tamp.Helm).
      - name: Lint Helm chart
        run: dotnet run --project build -- HelmLint

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Compile (emits the OpenAPI doc) -> npm ci -> regen typed client -> svelte-check -> vite build.
      - name: Build frontend (dogfood Tamp.Npm)
        run: dotnet run --project build -- FrontendBuild
