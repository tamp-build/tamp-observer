name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so SonarCloud can attribute new code / blame.
          fetch-depth: 0

      - name: Set up JDK 21
        # The SonarScanner for .NET runs on the JVM (SonarQube Cloud recommends 21).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Go
        # The collector's go.mod requires a newer toolchain than the runner's baseline; Go's
        # toolchain management auto-fetches it (GOTOOLCHAIN=auto). This just ensures `go` is present.
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 10.4.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Dogfood: tamp drives the scan. The Sonar target runs SonarBegin -> Compile -> Test (with
      # OpenCover coverage, Testcontainers-backed) -> SonarEnd. Docker is available on the runner.
      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet run --project build -- Sonar
